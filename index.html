<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日常记录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#f5f5f5;padding:20px 16px}
.timeline{max-width:640px;margin:0 auto}
.item{display:flex;gap:14px;margin-bottom:26px}
.date-tag{width:72px;flex-shrink:0;text-align:right;color:#888;font-size:14px;padding-top:4px}
.dot-wrap{position:relative}
.dot{width:10px;height:10px;border-radius:50%;background:#bbb;margin-top:6px}
.line{position:absolute;top:16px;left:4px;width:2px;height:calc(100% - 10px);background:#e2e2e2}
.card{flex:1;background:#fff;border-radius:14px;padding:16px;overflow:hidden}
.card-text{font-size:15px;color:#333;line-height:1.6;margin-bottom:12px}
.img-grid{display:grid;gap:6px;margin-bottom:10px}
.img-1{grid-template-columns:1fr}
.img-2,.img-3,.img-4{grid-template-columns:1fr 1fr}
.img-grid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;cursor:pointer;transition:0.2s}
.img-grid img:hover{opacity:0.92}
/* 视频、音频样式 */
video, audio {
  width: 100%;
  border-radius: 8px;
  margin-bottom:10px;
}
/* 大图弹窗 */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.9);z:999;display:none;align-items:center;justify-content:center;padding:20px}
.lightbox img{max-width:92%;max-height:92%;border-radius:6px}
.lightbox.show{display:flex}
.lightbox .close{position:absolute;top:18px;right:22px;color:#fff;font-size:30px;cursor:pointer}
</style>
</head>
<body>
<div class="timeline">
  <!-- ========== 新增：11🈷27 视频记录（放在最顶部） ========== -->
  <div class="item">
    <div class="date-tag">11🈷27</div>
    <div class="dot-wrap">
      <div class="dot"></div>
      <div class="line"></div>
    </div>
    <div class="card">
      <div class="card-text">🎬 小片段</div>
      <video controls>
        <source src="video(2).mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <!-- ========== 11🈷26 图文记录 ========== -->
  <div class="item">
    <div class="date-tag">11🈷26</div>
    <div class="dot-wrap">
      <div class="dot"></div>
      <div class="line"></div>
    </div>
    <div class="card">
      <div class="card-text">今日碎片✨</div>
      <div class="img-grid img-4">
        <img src="微信图片_20261126181410_281_106.jpg" alt="照片">
        <img src="微信图片_20261126181413_282_106.jpg" alt="照片">
        <img src="微信图片_20261126181415_283_106.jpg" alt="照片">
        <img src="微信图片_20261126181416_284_106.jpg" alt="照片">
      </div>
    </div>
  </div>

  <!-- ==========【模板1：带视频】复制这段就能用 ==========
  <div class="item">
    <div class="date-tag">11🈷27</div>
    <div class="dot-wrap">
      <div class="dot"></div>
      <div class="line"></div>
    </div>
    <div class="card">
      <div class="card-text">拍的小视频🎬</div>
      <video controls>
        <source src="你的视频.mp4" type="video/mp4">
      </video>
    </div>
  </div>
  -->

  <!-- ==========【模板2：带音频】复制这段就能用 ==========
  <div class="item">
    <div class="date-tag">11🈷28</div>
    <div class="dot-wrap">
      <div class="line"></div>
      <div class="dot"></div>
    </div>
    <div class="card">
      <div class="card-text">一段语音🎧</div>
      <audio controls>
        <source src="你的音频.mp3" type="audio/mpeg">
      
    </div>
  </div>
  -->

  <!-- ==========【模板3：图文+视频混在一起】 ==========
  <div class="item">
    <div class="date-tag">11🈷29</div>
    <div class="dot-wrap">
      <div class="dot"></div>
      <div class="line"></div>
    </div>
    <div class="card">
      <div class="card-text">图文+视频一起发</div>
      <div class="img-grid img-1">
        <img src="图片.jpg" alt="">
      </div>
      <video controls>
        <source src="视频.mp4" type="video/mp4">
      </video>
    </div>
  </div>
  -->
</div>

<!-- 放大弹窗 -->
<div class="lightbox" id="lb">
  <span class="close" onclick="closeLight()">×</span>
  <img id="lbimg" src="">
</div>

<script>
const lb = document.getElementById('lb')
const lbimg = document.getElementById('lbimg')
document.querySelectorAll('.img-grid img').forEach(img=>{
  img.onclick = ()=>{
    lbimg.src = img.src
    lb.classList.add('show')
  }
})
function closeLight(){
  lb.classList.remove('show')
}
document.onkeydown = e=>{
  if(e.key==='Escape') closeLight()
}
lb.onclick = e=>{
  if(e.target===lb) closeLight()
}
</script>
</body>
</html>
