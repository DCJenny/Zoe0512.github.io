<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秘密基地</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
body{background:#f5f5f5;padding:16px;max-width:700px;margin:0 auto}
.tip-bar{background:#fff8e6;border:1px solid #ffdd99;padding:12px 16px;border-radius:12px;margin-bottom:20px;color:#664400;font-size:14px;line-height:1.5}
.timeline-item{background:#fff;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px #00000010}
.item-label{color:#888;font-size:13px;margin-bottom:8px}
.item-text{font-size:15px;line-height:1.6;margin-bottom:12px;color:#333}
.media-wrap{display:flex;gap:8px;flex-wrap:wrap}
.media-preview{width:300px;height:300px;object-fit:cover;border-radius:10px;cursor:pointer;background:#eee}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:999;padding:16px}
.modal-content{max-width:90vw;max-height:90vh}
.modal-img{max-width:90vw;max-height:90vh;object-fit:contain}
.modal-video{max-width:90vw;max-height:90vh}
.close-btn{position:absolute;top:16px;right:24px;color:#fff;font-size:32px;cursor:pointer}
.nav-btn{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:40px;background:rgba(0,0,0,0.3);border:none;padding:8px 14px;border-radius:8px;cursor:pointer}
.prev{left:16px}
.next{right:16px}
</style>
</head>
<body>
<div class="tip-bar">
版本仓促，仅用于个人记录展示，不会收集任何浏览数据。
</div>

<!-- 新增临时记录 -->
<div class="timeline-item">
  <div class="item-label">临时</div>
  <div class="item-text">我上次也拍了！我现在还在加班中TT，突然来了个紧急的活要处理呃啊</div>
  <div class="media-wrap">
    <img class="media-preview" src="先2.jpg" onclick="openGallery(this)">
    <img class="media-preview" src="1.jpg" onclick="openGallery(this)">
  </div>
</div>

<!-- 之前那条临时记录 -->
<div class="timeline-item">
  <div class="item-label">临时</div>
  <div class="item-text">我好好吃饭啦！如果这真的是最后一场，那就尽全力好好享受，给这一段篇章留下幸福的尾声吧～～</div>
  <div class="media-wrap">
    <img class="media-preview" src="1127.jpg" onclick="openGallery(this)">
  </div>
</div>

<!-- 视频记录 -->
<div class="timeline-item">
  <div class="item-label">11🈷27号</div>
  <div class="media-wrap">
    <img class="media-preview" src="video(2).mp4" onclick="openVideo('video(2).mp4')">
  </div>
</div>

<!-- 11月26日图文 -->
<div class="timeline-item">
  <div class="item-label">11🈷26号</div>
  <div class="media-wrap">
    <img class="media-preview" src="img1.jpg" onclick="openGallery(this)">
    <img class="media-preview" src="img2.jpg" onclick="openGallery(this)">
    <img class="media-preview" src="img3.jpg" onclick="openGallery(this)">
    <img class="media-preview" src="img4.jpg" onclick="openGallery(this)">
  </div>
</div>

<!-- 弹窗容器 -->
<div class="modal" id="modal">
  <span class="close-btn" onclick="closeModal()">×</span>
  <button class="nav-btn prev" onclick="prevImg()">‹</button>
  <div class="modal-content">
    <img class="modal-img" id="modalImg">
    <video class="modal-video" id="modalVideo" controls></video>
  </div>
  <button class="nav-btn next" onclick="nextImg()">›</button>
</div>

<script>
let galleryList = [];
let currentIdx = 0;
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');
const modalVideo = document.getElementById('modalVideo');

function openGallery(el){
  const items = el.parentElement.querySelectorAll('.media-preview');
  galleryList = Array.from(items).map(x=>x.src);
  currentIdx = galleryList.indexOf(el.src);
  showImage();
  modal.style.display='flex';
}
function showImage(){
  modalImg.style.display='block';
  modalVideo.style.display='none';
  modalImg.src = galleryList[currentIdx];
}
function prevImg(){
  currentIdx = (currentIdx -1 + galleryList.length) % galleryList.length;
  showImage();
}
function nextImg(){
  currentIdx = (currentIdx +1) % galleryList.length;
  showImage();
}
function openVideo(src){
  modalImg.style.display='none';
  modalVideo.style.display='block';
  modalVideo.src = src;
  modalVideo.play();
  modal.style.display='flex';
}
function closeModal(){
  modal.style.display='none';
  modalVideo.pause();
}
document.onkeydown = e=>{
  if(modal.style.display==='flex'){
    if(e.key==='Escape') closeModal();
    if(e.key==='ArrowLeft') prevImg();
    if(e.key==='ArrowRight') nextImg();
  }
}
modal.onclick = e=>{if(e.target===modal) closeModal()}
</script>
</body>
</html>
